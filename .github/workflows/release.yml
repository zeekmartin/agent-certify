name: release

# Final releases only (v1.2.3). Pre-releases (v1.2.3rc1, a1, b1) go to TestPyPI via pre-release.yml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version (agent_certify.__version__)
        run: |
          python - <<'EOF'
          import ast, os, sys
          tree = ast.parse(open("src/agent_certify/__init__.py", encoding="utf-8").read())
          version = next(n.value.value for n in tree.body if isinstance(n, ast.Assign)
                         and getattr(n.targets[0], "id", "") == "__version__")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"::error::tag {tag} does not match __version__ {version}")
          print(f"tag {tag} matches version {version}")
          EOF
      - run: pip install "build==1.6.1" "twine==7.0.0"
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi            # protect it in Settings → Environments (required reviewers, tags v* only)
    permissions:
      id-token: write            # PyPI Trusted Publishing (OIDC) and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      # Preferred: Trusted Publishing. Needs a (pending) publisher on PyPI for this repository,
      # workflow release.yml and environment pypi. Produces attestations; no long-lived token.
      - name: Publish with Trusted Publishing
        id: trusted
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      # Fallback while Trusted Publishing is not configured: the AGENT_CERTIFY API token.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.trusted.outcome == 'failure'
        with:
          python-version: "3.12"
      - name: Publish with the API token (fallback, no attestations)
        if: steps.trusted.outcome == 'failure'
        env:
          TWINE_USERNAME: __token__
          PYPI_TOKEN: ${{ secrets.AGENT_CERTIFY }}
        run: |
          echo "::warning::Trusted Publishing failed or is not configured; falling back to the API token."
          # A pasted secret can carry a trailing newline, which PyPI would reject as bad credentials.
          TWINE_PASSWORD="$(printf '%s' "$PYPI_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::Trusted Publishing failed and the AGENT_CERTIFY secret is not set."
            exit 1
          fi
          case "$TWINE_PASSWORD" in pypi-*) ;; *)
            echo "::error::AGENT_CERTIFY does not hold a PyPI API token (expected a pypi-… value)."; exit 1 ;;
          esac
          export TWINE_PASSWORD
          pip install "twine==7.0.0"
          twine upload --skip-existing dist/*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, re, sys
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not m:
              sys.exit(f"::error::CHANGELOG.md has no '## [{version}]' section")
          open("release-notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          EOF
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "agent-certify $GITHUB_REF_NAME" --notes-file release-notes.md
