name: pre-release

# Release candidates, alphas and betas (v1.2.3rc1, v1.2.3a1, v1.2.3b1) go to TestPyPI,
# then a clean install from TestPyPI is verified on Ubuntu and Windows.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must match the package version
        id: version
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"::error::tag {tag} does not match pyproject version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          EOF
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install twine
      - name: Upload to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.CE_TEST_PUBLISH }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::The CE_TEST_PUBLISH secret (a test.pypi.org token) is not set for this repository."
            exit 1
          fi
          twine upload --repository-url https://test.pypi.org/legacy/ dist/*

  verify-install:
    needs: [build, publish-testpypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install from TestPyPI (retry while the index catches up)
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ \
              "agent-certify==$VERSION" && break
            echo "not available yet (attempt $i), waiting 30s"; sleep 30
          done
          pip show agent-certify
      - name: Run it
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(agent-certify --version)" = "agent-certify $VERSION"
          agent-certify scan --help > /dev/null
          agent-certify mcp --help > /dev/null
