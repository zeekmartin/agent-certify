name: pre-release

# Release candidates, alphas and betas (v1.2.3rc1, v1.2.3a1, v1.2.3b1) go to TestPyPI,
# then a clean install from TestPyPI is verified on Ubuntu and Windows.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the package version (agent_certify.__version__)
        id: version
        run: |
          python - <<'EOF'
          import ast, os, sys
          tree = ast.parse(open("src/agent_certify/__init__.py", encoding="utf-8").read())
          version = next(n.value.value for n in tree.body if isinstance(n, ast.Assign)
                         and getattr(n.targets[0], "id", "") == "__version__")
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"::error::tag {tag} does not match __version__ {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          EOF
      - run: pip install "build==1.6.1" "twine==7.0.0"
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "twine==7.0.0"
      - name: Upload to TestPyPI
        env:
          TWINE_USERNAME: __token__
          PYPI_TOKEN: ${{ secrets.CE_TEST_PUBLISH }}
        run: |
          TWINE_PASSWORD="$(printf '%s' "$PYPI_TOKEN" | tr -d '[:space:]')"
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::The CE_TEST_PUBLISH secret (a test.pypi.org token) is not set for this repository."
            exit 1
          fi
          export TWINE_PASSWORD
          twine upload --repository-url https://test.pypi.org/legacy/ dist/*

  verify-install:
    needs: [build, publish-testpypi]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependencies from PyPI only
        shell: bash
        run: |
          # TestPyPI is open to anyone: never let it resolve numpy or cryptography.
          deps=$(python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
          printf '%s\n' "$deps" > deps.txt
          pip install --index-url https://pypi.org/simple/ -r deps.txt
      - name: agent-certify alone from TestPyPI (retry while the index catches up)
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            pip install --no-deps --index-url https://test.pypi.org/simple/ "agent-certify==$VERSION" && break
            echo "not available yet (attempt $i), waiting 30s"; sleep 30
          done
          pip show agent-certify
      - name: Run it
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(agent-certify --version)" = "agent-certify $VERSION"
          agent-certify scan --help > /dev/null
          agent-certify mcp --help > /dev/null
