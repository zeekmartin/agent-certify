[build-system]
requires = ["setuptools>=77.0"]   # SPDX `license` string + `license-files` (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "agent-certify"
dynamic = ["version"]        # single source: agent_certify.__version__
description = "Structural verification of multiagent systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "David Martin Venti", email = "david.martin@cognitive-engineering.dev"}
]
keywords = ["multiagent", "agent", "structural-analysis", "fragility", "graph-theory", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
# The MCP server, OTel exporter and Cursor parser need nothing beyond the core
# dependencies; these extras exist so `pip install agent-certify[mcp]` etc. work.
mcp = []           # stdio MCP server, no `mcp` package
otel = []          # OTLP/JSON spans, no OpenTelemetry SDK
cursor = []        # Cursor Agent Trace parser
all = []
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
agent-certify = "agent_certify.cli:main"

[project.urls]
Homepage = "https://cognitive-engineering.dev"
Repository = "https://github.com/zeekmartin/agent-certify"
Documentation = "https://github.com/zeekmartin/agent-certify#readme"
Changelog = "https://github.com/zeekmartin/agent-certify/blob/main/CHANGELOG.md"
Issues = "https://github.com/zeekmartin/agent-certify/issues"

[tool.setuptools.dynamic]
version = {attr = "agent_certify.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
