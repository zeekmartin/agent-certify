[build-system]
requires = ["setuptools>=77.0"]   # SPDX `license` string + `license-files` (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "agent-certify"
dynamic = ["version"]        # single source: agent_certify.__version__
description = "Structural verification of multiagent systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Cognitive Engineering", email = "david.martin@cognitive-engineering.dev"}
]
keywords = ["multiagent", "agent", "structural-analysis", "fragility", "graph-theory", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # A floor is a promise that the oldest resolution installs, passes the test
    # suite and is tested by CI. It is not a security control: an
    # unconstrained `pip install` takes the most recent release anyway, and a
    # deployment that *freezes* a version has to follow that project's own
    # advisories whatever this floor says. A floor higher than necessary only
    # blocks the install on a frozen image, which is where this tool is most
    # likely to be audited. So each floor is as low as CI can prove: the
    # `lowest` job installs exactly these two versions under Python 3.10 and
    # runs the whole suite against them.
    #
    # numpy 1.26.4 (2024-02-05), the last 1.26 patch: the oldest release the
    # suite passes on under Python 3.10. Only `asarray`, `triu_indices`,
    # `fill_diagonal`, `add.at`, `linalg.norm` and `default_rng` are used, all
    # 1.17-era API, so nothing here needs numpy 2.
    "numpy>=1.26.4",
    # cryptography 46.0.0 (2025-09-16): the oldest series that has the Ed25519
    # API this package signs with *and* ships wheels for every interpreter in
    # the matrix (46 is the first with cp314; the abi3 wheels cover 3.10-3.13),
    # about 14 months old. Their security policy covers the main branch and the
    # most recent release only
    # (https://cryptography.io/en/latest/security/), so a frozen older series
    # is on the operator to track - see SECURITY.md section 2.
    "cryptography>=46.0.0",
]

[project.optional-dependencies]
# The MCP server, OTel exporter and Cursor parser need nothing beyond the core
# dependencies; these extras exist so `pip install agent-certify[mcp]` etc. work.
mcp = []           # stdio MCP server, no `mcp` package
otel = []          # OTLP/JSON spans, no OpenTelemetry SDK
cursor = []        # Cursor Agent Trace parser
all = []
dev = ["pytest>=7.0", "pytest-cov", "ruff", "tomli; python_version < '3.11'"]

[project.scripts]
agent-certify = "agent_certify.cli:main"

[project.urls]
Homepage = "https://cognitive-engineering.dev"
Repository = "https://github.com/zeekmartin/agent-certify"
Documentation = "https://github.com/zeekmartin/agent-certify#readme"
Changelog = "https://github.com/zeekmartin/agent-certify/blob/main/CHANGELOG.md"
Issues = "https://github.com/zeekmartin/agent-certify/issues"

[tool.setuptools.dynamic]
version = {attr = "agent_certify.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
